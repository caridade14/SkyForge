name: SkyForge Phase 7 CI

on:
  push:
    branches:
      - agent/phase7-functional-scene-engine
  pull_request:

concurrency:
  group: phase7-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
      - run: npm test
      - run: node --check server-skyforge-phase7.js
      - run: node --check phase7-gpu-renderer.js
      - run: node --check phase7-functional-controller.js
