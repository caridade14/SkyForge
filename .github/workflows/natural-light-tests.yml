name: Natural Light Engine Tests

on:
  push:
    branches:
      - main
      - feature/natural-light-engine
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: natural-light-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  natural-light:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run Node test suite
        run: npm test

      - name: Validate gateway and client syntax
        run: |
          node --check server-natural-light.js
          node --check natural-light-preview.js

      - name: Validate Natural Light modules
        run: |
          node --check src/natural-light/solar-core.js
          node --check src/natural-light/atmosphere-core.js
          node --check src/natural-light/gas-absorption-core.js
          node --check src/natural-light/atmosphere-advanced.js
          node --check src/natural-light/multiple-scattering-core.js
          node --check src/natural-light/atmosphere-multiple.js
          node --check src/natural-light/input-schema.js
          node --check src/natural-light/lut-core.js
          node --check src/natural-light/lut-phase4.js
          node --check src/natural-light/index.js

      - name: Smoke test physical preview gateway
        run: |
          npm start > /tmp/skyforge-natural-light.log 2>&1 &
          SKYFORGE_PID=$!
          trap 'kill $SKYFORGE_PID 2>/dev/null || true; cat /tmp/skyforge-natural-light.log' EXIT

          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/api/lighting/health > /tmp/lighting-health.json; then
              break
            fi
            sleep 0.25
          done

          node - <<'NODE'
          const health = require('/tmp/lighting-health.json');
          if (!health.ok || !health.previewInjection) process.exit(1);
          if (health.model !== 'skyforge-natural-light-phase4') process.exit(1);
          if (health.multipleScatteringModel !== 'skyforge-multiple-scattering-phase4') process.exit(1);
          if (health.skyViewLutModel !== 'skyforge-sky-view-lut-phase4') process.exit(1);
          if (health.transmittanceLutModel !== 'skyforge-transmittance-lut-phase3') process.exit(1);
          if (health.multipleScatteringLutModel !== 'skyforge-multiple-scattering-lut-phase4') process.exit(1);
          NODE

          curl -fsS http://127.0.0.1:3000/ | grep -q 'natural-light-preview.js'
          curl -fsS http://127.0.0.1:3000/natural-light-preview.js | grep -q 'SkyForgeNaturalLightPreview'

          curl -fsS \
            -H 'Content-Type: application/json' \
            -d '{"input":{"latitude":48.8566,"longitude":2.3522,"dateTime":"2026-07-09T14:00:00+02:00","altitudeMeters":35,"aerosolOpticalDepth550":0.12,"aerosolSingleScatteringAlbedo":0.92,"groundAlbedo":0.2,"ozoneDobsonUnits":320,"precipitableWaterCm":2.1,"multipleScatteringOrders":4},"lut":{"width":8,"height":4},"transmittanceLut":{"width":8,"height":4,"maxAltitudeMeters":20000},"multipleScatteringLut":{"width":8,"height":4,"maxAltitudeMeters":20000}}' \
            http://127.0.0.1:3000/api/lighting/preview > /tmp/physical-preview.json

          node - <<'NODE'
          const result = require('/tmp/physical-preview.json');
          if (result.sceneState?.schema?.id !== 'skyforge.natural-light') process.exit(1);
          if (result.sceneState?.solver?.id !== 'skyforge-natural-light-phase4') process.exit(1);
          if (result.evaluation?.model?.id !== 'skyforge-natural-light-phase4') process.exit(1);
          if (result.evaluation?.multipleScattering?.model?.id !== 'skyforge-multiple-scattering-phase4') process.exit(1);
          if (!(result.evaluation?.irradiance?.broadbandGasTransmittance > 0)) process.exit(1);
          if (result.skyViewLut?.model?.id !== 'skyforge-sky-view-lut-phase4') process.exit(1);
          if (result.skyViewLut?.pixels?.length !== 8 * 4 * 3) process.exit(1);
          if (result.transmittanceLut?.pixels?.length !== 8 * 4 * 4) process.exit(1);
          if (result.multipleScatteringLut?.pixels?.length !== 8 * 4 * 4) process.exit(1);
          NODE

          curl -fsS \
            -H 'Content-Type: application/json' \
            -d '{"input":{"latitude":48.8566,"longitude":2.3522,"dateTime":"2026-07-09T14:00:00+02:00"},"transmittanceLut":{"width":4,"height":2}}' \
            http://127.0.0.1:3000/api/lighting/lut/transmittance > /tmp/transmittance-lut.json

          node -e "const l=require('/tmp/transmittance-lut.json'); if(l.pixels?.length!==4*2*4) process.exit(1)"

          curl -fsS \
            -H 'Content-Type: application/json' \
            -d '{"input":{"latitude":48.8566,"longitude":2.3522,"dateTime":"2026-07-09T14:00:00+02:00","groundAlbedo":0.2,"multipleScatteringOrders":4},"multipleScatteringLut":{"width":4,"height":2}}' \
            http://127.0.0.1:3000/api/lighting/lut/multiple-scattering > /tmp/multiple-scattering-lut.json

          node - <<'NODE'
          const lut = require('/tmp/multiple-scattering-lut.json');
          if (lut.model?.id !== 'skyforge-multiple-scattering-lut-phase4') process.exit(1);
          if (lut.pixels?.length !== 4 * 2 * 4) process.exit(1);
          NODE
