name: Natural Light Engine Tests

on:
  push:
    branches:
      - main
      - feature/natural-light-engine
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  natural-light:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run Node test suite
        run: npm test

      - name: Validate gateway syntax
        run: node --check server-natural-light.js

      - name: Validate Natural Light modules
        run: |
          node --check src/natural-light/solar-core.js
          node --check src/natural-light/atmosphere-core.js
          node --check src/natural-light/input-schema.js
          node --check src/natural-light/lut-core.js
          node --check src/natural-light/index.js
